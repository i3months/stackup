# R-SRCraw-CH-head — R-SRC-raw 에서 청킹만 바꾼다 (탐색 조건, P-019: 원문 위 청킹 효과).
condition_id: R-SRCraw-CH-head
description: "원문 인덱싱 + 헤딩 단위 청킹 (최대 2000)"
index_source: raw            # summary | raw | both
chunk_size: 2000
chunk_overlap: 0
chunk_mode: heading          # recursive (헤딩 → 크기) | heading (헤딩 단위만, 최대 chunk_size)
prefix: deterministic        # deterministic | none | llm
embedder: EMB-1              # common.MODELS
query_instruction: none      # none | query (모델 카드 prompt_name="query")
dtype: fp32                  # fp32 | bf16
truncate_dim: null           # MRL 절단 차원 (R-EMB-4m 만)
retrieval: hybrid_simple     # hybrid_simple | vector | hybrid_kiwi | bm25_kiwi
cand: k                      # k | 4k | 정수
reranker: none               # none | RR-1 | RR-2
rerank_stage1: 20            # 재순위 1단계 cand = limit
exploratory: true
